name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  # Cloudflare/Pages action posts a deployment status to the commit.
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Don't run on the upstream template repo itself — only on forks that
    # have configured their own Cloudflare project.
    if: github.repository != 'vibeacademy/agile-flow-gcp'

    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'agile-flow-docs' }}

    steps:
      - name: Check for required secrets
        id: check_secrets
        # GitHub Actions rejects `secrets.*` in `if:` expressions, so we
        # promote presence checks into outputs that downstream `if:` gates
        # can read. See docs/PATTERN-LIBRARY.md and the legacy GCP-deploy
        # job (which used the same pattern).
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured — skipping deploy."
            echo "See docs/TECHNICAL-ARCHITECTURE.md 'Deployment' for setup instructions."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check_secrets.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check_secrets.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_secrets.outputs.skip != 'true'
        run: npm ci

      - name: Build site
        if: steps.check_secrets.outputs.skip != 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      # Use the official Cloudflare Wrangler action. Pinned to v3 (current
      # stable as of 2026-05). The `pages deploy` subcommand uploads the
      # `dist/` directory to the named Pages project. Branch is inferred
      # from $GITHUB_REF; main maps to production, every other branch
      # gets a preview URL automatically.
      - name: Deploy to Cloudflare Pages
        if: steps.check_secrets.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
